[project]
name = "gtnh-extra-mod-manager"
# 版本与 gtnhmod/__init__.py 的 __version__ 保持一致（发布 tag v* 以它为准）
version = "1.4.0"
description = "GTNH 整合包额外 mod 管理工具：wiki 数据同步、双端安装/更新/备份"
readme = "README.md"
requires-python = ">=3.10"

[project.optional-dependencies]
# 可选：wiki 站开启 Cloudflare 反爬后，模拟浏览器 TLS 指纹直连（首选抓取通道）
fast-wiki = ["curl_cffi>=0.7"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["gtnhmod"]

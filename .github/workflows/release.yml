name: Release

# push tag v* 时自动构建 Windows exe 并发布 Release
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write  # 允许创建 Release

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.10"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install curl_cffi websocket-client Pillow pyinstaller

      - name: 运行测试
        run: python -m unittest discover -s tests

      - name: 构建 exe
        shell: cmd
        run: scripts\build_exe.bat

      - name: 验证成品 Wiki 联网同步
        run: python scripts/verify_packaged_wiki.py dist/gtnh-cli.exe

      - name: 验证成品资源包与光影同步
        run: python scripts/verify_packaged_packs.py dist/gtnh-cli.exe

      - name: 打包 zip
        shell: pwsh
        run: |
          Compress-Archive -Path "dist/GTNHModManager.exe","dist/gtnh-cli.exe","README.md" `
            -DestinationPath "dist/GTNHModManager-${{ github.ref_name }}-win64.zip"

      - name: 发布 Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          files: dist/GTNHModManager-*-win64.zip
          generate_release_notes: true

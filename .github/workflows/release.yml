name: Release

# push tag v* 时自动构建 Windows exe 并发布 Release
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write  # 允许创建 Release

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install curl_cffi pyinstaller

      - name: 运行测试
        run: python -m unittest discover -s tests

      - name: 构建 exe
        run: |
          pyinstaller --onefile --windowed --name GTNHModManager --collect-all curl_cffi launcher_gui.py
          pyinstaller --onefile --console --name gtnh-cli --collect-all curl_cffi launcher_cli.py

      - name: 打包 zip
        shell: pwsh
        run: |
          Compress-Archive -Path "dist/GTNHModManager.exe","dist/gtnh-cli.exe","README.md" `
            -DestinationPath "dist/GTNHModManager-${{ github.ref_name }}-win64.zip"

      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/GTNHModManager-*-win64.zip
          generate_release_notes: true
